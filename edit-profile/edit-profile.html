<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>
<link rel="stylesheet" href="edit-profile.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="card">

        <h1>
            <i class="fa-solid fa-user-pen"></i>
            Edit Profile
        </h1>

        <p class="subtitle">Update your personal information.</p>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" value="Assal Al-Nabulsi">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Major</label>
            <input type="text" placeholder="e.g. Computer Engineering" value="Computer Engineering">

            <label>Bio</label>
            <textarea placeholder="Tell us a bit about yourself..." rows="4"></textarea>

            <button type="submit">Save Changes</button>

        </form>

    </div>
</div>

</body>
</html>
