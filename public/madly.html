=== مادة Introduction to IoT ===

Section 1 - مقدمة في إنترنت الأشياء (IoT):
- التعريف: شبكة من الأشياء المتصلة التي تتواصل بدون تدخل بشري (أجهزة ذكية، إلكترونيات، آلات). IoT هو نظام من الأجهزة الحوسبية والميكانيكية والرقمية المترابطة، لكل منها معرّف فريد (UID)، وقادرة على نقل البيانات عبر شبكة دون تدخل بشري.
- التاريخ: 1982 أول جهاز متصل (آلة كوكاكولا)، 1991 ورقة Mark Weiser عن Ubiquitous Computing، 1993-1997 محاولات من Microsoft وNovell، 1999 بدأ المجال بالانتشار الفعلي.
- أنواع الشبكات: LAN (شبكة محلية بين الأجهزة)، MAN (بين الخوادم، منطقة جغرافية أكبر)، WAN (شبكة واسعة/تغطي مدن)، PAN (شبكة شخصية تربط أجهزة الشخص نفسه).
- أكثر تقنيات IoT شيوعًا: أجهزة مراقبة المرضى Patient monitors (64%)، عدادات الطاقة Energy meters (56%)، الأشعة والتصوير X-rays and imaging (33%).

Section 2 - التقنيات المُمكِّنة (Enabling Technologies):
- Addressability: فكرة Auto-ID center تعتمد على RFID والترميز الإلكتروني للمنتج EPC، بحيث كل جهاز له ID خاص فيه.
- Application Layer: يتطلب بروتوكولات وإطار عمل لتطبيقات IoT (مثال: ADRC).
- التقنيات اللاسلكية قصيرة المدى: Bluetooth، LiFi (يستخدم LED كمرسل، تكلفة أقل لكن يحتاج خط رؤية Line of Sight)، NFC، RFID (مسح بدون تلامس)، WiFi (802.11)، ZigBee (استهلاك طاقة منخفض، معدل بيانات منخفض، تكلفة منخفضة)، Z-Wave (للأتمتة والأمان).
- التقنيات متوسطة المدى: سرعة عالية، throughput أعلى، latency أقل، تغطية جيدة، مثال: 5G (عدد مستخدمين كبير لكل جهاز).
- التقنيات طويلة المدى: LPWAN (طاقة منخفضة)، VSAT (تقنية أقمار صناعية بأطباق صغيرة للـ narrowband وbroadband)، معادلة SNR = Ps/Pn.
- التقنيات السلكية: Ethernet (أزواج ملتوية وألياف ضوئية مع Hubs/Switches)، PLC (نقل البيانات عبر الأسلاك الكهربائية، مثال: HomePlug، G.hn).

Section 3 - تطبيقات IoT حسب المجال:
- تطبيقات استهلاكية: 1) Smart Home (أتمتة التدفئة والإضاءة والتكييف، توفير الطاقة بإطفاء الإضاءة تلقائيًا). 2) Elder Care (رعاية كبار السن وذوي الإعاقة).
- تطبيقات مؤسساتية: 1) الرعاية الصحية (جمع وتحليل بيانات للبحث والمراقبة). 2) النقل. 3) V2X Communication (اتصال المركبة بكل شيء): V2V (مركبة لمركبة)، V2I (مركبة لبنية تحتية)، V2P (مركبة لمشاة) — وهي الخطوة الأولى نحو القيادة الذاتية.
- Building & Home Automation: مراقبة والتحكم بالأنظمة الميكانيكية والكهربائية والإلكترونية في المباني (عامة أو خاصة أو صناعية أو سكنية).
- تطبيقات صناعية: 1) التصنيع Manufacturing. 2) الزراعة Agriculture (جمع بيانات الحرارة والأمطار والرطوبة وسرعة الرياح والآفات والتربة لاتخاذ قرارات مستنيرة وتقليل الهدر — مثال: مراقبة رطوبة التربة عن بُعد وتطبيق برامج تسميد دقيقة).
- تطبيقات البنية التحتية: 1) إدارة الطاقة (تقليل استهلاك الطاقة وتحسين كفاءة الإنتاج). 2) المراقبة البيئية (جودة المياه، الظروف الجوية والتربة، حركة الحياة البرية). 3) Living Lab (يجمع بين البحث والابتكار).
- تطبيقات عسكرية: Internet of Battlefield Things (مبادرة من مختبر أبحاث الجيش الأمريكي ARL لتعزيز قدرات الجنود)، Ocean of Things (برنامج لمراقبة وتحليل الأنشطة البيئية والسفن عبر محيط واسع).

الاتجاهات البحثية والمعمارية:
- مشاكل كثرة المستخدمين: 1) ازدحام الشبكة Network traffic (يسبب تأخير). 2) التعارض Conflict (نفس التردد/الموقع/الوقت، يسبب إعادة إرسال). الحل: التحكم بالوصول المتعدد Multiple Access Control: CDMA (Code)، SDMA (Space)، FDMA (Frequency)، TDMA (Time).
- الذكاء (Intelligence): يمكن تقديمه على 3 مستويات: 1) أجهزة IoT، 2) عقد Edge/Fog، 3) الحوسبة السحابية Cloud — وتعتمد الحاجة للذكاء وسرعة القرار في كل مستوى على حساسية التطبيق للوقت (مثال: كاميرا مركبة ذاتية القيادة تحتاج كشف عوائق فوري).
- المعمارية: نظام IoT يتكون من 3 طبقات: Tier 1: الأجهزة (Devices) — حساسات Sensors وفعّالات Actuators. Tier 2: بوابة الحافة (Edge Gateway) — تجميع البيانات ومعالجتها الأولية وربطها بالسحابة (مثل WebSockets، Event Hub) وأحيانًا Edge Analytics/Fog Computing. Tier 3: السحابة (Cloud) — تخزين ومعالجة متقدمة.
- قابلية التوسع (Scalability): قدرة الشبكة على إضافة/إزالة مستخدمين دون التأثير على الوظيفة الأساسية. تُستخدم بروتوكولات خفيفة مثل MQTT وZeroMQ (ضمن CoAP الخاص بـ IETF)، وFog Computing كبديل لتجنب انفجار تدفق البيانات نحو السحابة.
- اعتبارات الحجم والمكان: Smart devices، Online (متصلة بنفس الوقت)، Location للحساسات، GPS، إحداثيات نسبية Relative، وGeo Web / Digital Earth (تطبيقات تصبح ممكنة عند تنظيم الأشياء حسب موقعها).

Section 4 - تحديات IoT:
1) الأمان (Security): أكبر تحدٍ، لأن أي تقنية جديدة تجذب هجمات.
2) التنظيم (Regulation): التشريعات الحكومية تستغرق وقتًا طويلاً لمواكبة تطور التقنية، وضعف التنظيم يزيد المخاطر الأمنية مع توسع سطح الهجوم.
3) التوافقية (Compatibility): Bluetooth معيار توافق قديم لأجهزة IoT؛ في أتمتة المنزل تُستخدم ZigBee وZ-Wave؛ استمرار التوافقية يعتمد على المستخدمين أنفسهم.
4) عرض النطاق الترددي (Bandwidth): العدد الهائل من الاتصالات قد يسبب قيودًا، خصوصًا مع تطبيقات تتطلب bandwidth عالٍ مثل بث الفيديو؛ الحل جزئيًا بالتبديل الذكي بين مشغلي الشبكات المتاحة.
5) استهلاك الطاقة (Energy Consumption): السعي لزيادة عمر البطارية عبر أوضاع Idle/Sleep (تردد منخفض) وNormal/Full mode (تردد عالٍ).
6) توقعات العملاء (Customer Expectations): السوق تنافسي والعملاء يتوقعون تجربة سلسة ومتقدمة دائمًا.

مقدمة في البرمجة لـ IoT:
- أجيال لغات البرمجة: 1) الآلة (Machine)، 2) التجميع (Assembly)، 3) عامة الغرض (مثل C/C++، Java)، 4) متخصصة (مثل Python، SQL، Matlab)، 5) أكثر تخصصًا (مثل Prolog).
- Microcontroller (حاسوب صغير على شريحة واحدة، لتطبيقات مدمجة مثل نظام ري أوتوماتيكي) مقابل Microprocessor (غرض عام، أجزاء منفصلة، كالحاسوب/الهاتف الذكي).
- المذبذب Oscillator يولّد الترددات كنبضات، وكل نبضة تمثل تعليمة. الهاردوير يُستخدم لـ: تنفيذ الحسابات (المعالج)، تذكّر البيانات (الذاكرة)، التواصل مع أجهزة أخرى (الشبكات).
- التفاعل مع العالم الحقيقي عبر Sensors وActuators؛ البرمجيات: 1) المعالج (ينفذ البرنامج) 2) الذاكرة (تخزن البيانات والبرنامج) 3) الحساسات والفعّالات.
- سيناريوهات تطبيقية: 1) نظام ري ذكي (حساسات متعددة لمراقبة الحرارة والرطوبة، قياسات سابقة تُخزَّن لتحديد وقت ومدة الري، فعّالات لتشغيل/إيقاف الري، شبكة للمراقبة والتحكم عن بعد). 2) نظام مواقف ذكي (حساسات لمراقبة الإشغال، قياسات سابقة للتنبؤ بالطلب، فعّالات لعرض توفر المواقف، شبكة للمراقبة أو إرسال رسائل طارئة).
- أنواع البيانات: تحدد معنى البيانات الثنائية المخزّنة (أرقام، نصوص، قيم منطقية). لغة C لغة "صارمة النوع" (Strictly typed): كل قيمة يجب أن يكون لها نوع محدد — int (عدد صحيح)، double (عدد صحيح + جزء عشري)، char (حرف)؛ لا يوجد نوع Boolean في C: صفر = false، وأي قيمة أخرى (عادة 1) = true.
- التعليقات Comments: نص غير رسمي لا يؤثر على تنفيذ البرنامج (// للسطر، /* */ للكتلة)، تساعد المبرمجين على فهم كيفية أو لماذا يعمل الكود.
- التعبيرات Expressions: رياضية أو منطقية، تتكون من متغيرات Variables وقيم ثابتة Literals ومؤثرات Operators (+ - * / %).

التجربة 4 - المؤثرات المنطقية AND / OR / XOR:
- AND: يُستخدم لتصفير بت معين (Clear) — أي بت AND مع 0 يصبح 0، وأي بت AND مع 1 يبقى كما هو.
- OR: يُستخدم لتعيين بت معين (Set) — أي بت OR مع 1 يصبح 1، وأي بت OR مع 0 يبقى كما هو.
- XOR: تنفذ عملية Exclusive-OR — إذا تشابه البتان تكون النتيجة 0، وإذا اختلفا تكون 1.
- أمثلة عملية: تحويل حرف من كبير لصغير باستخدام OR (إضافة 32 بتعيين البت b5): MOV AL,'A' / OR AL,00100000b. تحويل من صغير لكبير باستخدام AND (تصفير البت b5): MOV AL,'a' / AND AL,11011111b. ونفس التحويلين ممكنان أيضًا باستخدام XAL,00100000b.

التجربة 5 - الإزاحة والتدوير (Shift & Rotate):

- تطبيق SHL/SAL: يضرب القيمة بـ 2^n (عدد بتات الإزاحة). تطبيق SHR: يقسم القيمة على 2^n. تطبيق SAR: يقسم مع الحفاظ على الإشارة (Sign) عبر تكرار بت الإشارة عند الإزاحة لليمين.
- التدوير Rotate: بدون Carry: ROL (لليمين) وROR (لليسار) — لا تغيّر علم Carry Flag. مع Carry: RCL وRCR — تُدخل/تُخرج علم الـ Carry Flag ضمن عملية التدوير وتغيّره.
- مثال عملي (Part1): MOV DL,5 ثم MOV CL,2 ثم SHL DL,CL يعطي DL = 5×2² = 14H (20 عشري).
- مثال عملي (Part2 قسمة على 4): استخدام SAR AL,CL مع CL=2 لتنفيذ AL = AL ÷ 4.

التجربة 6 - المقارنة والقفز والحلقات:

- Loop: تعليمة تكرار تعتمد على قيمة CX (تُنقص CX تلقائيًا في كل تكرار وتستمر حتى يصبح صفرًا) — تُستخدم مثلًا لجمع عناصر مصفوفة (DB) عبر مؤشر SI مع Add وInc SI وLoop.

التجربة 7 - عمليات ADD, SUB, MUL, DIV:
- ADD: Z = X + Y (مثال: ADD AX,BX، الناتج في AX).
- SUB: Z = X - Y (مثال: SUB AX,BX، الناتج في AX).
- MUL: Z = X × Y، يجب أن يكون المُعامِلان (X, Y) بنفس الحجم، والناتج (Z) ضعف حجمهما ويُقسَّم بين سجلين (مثال: MUL BX يعطي AX×BX بحيث النصف الأعلى في DX والنصف الأدنى في AX). MUL يضبط أعلام Carry وOverflow إذا كان النصف الأعلى من الناتج لا يساوي صفرًا.
- DIV: Z = X ÷ Y، يجب أن يكون شرط المقسوم عليه بنفس حجم القسمة؛ الناتج (Quotient) في AX، والباقي (Remainder) في DX.

التجربة 8 - المقاطعات البرمجية (Software Interrupts):

- INT 10H: DH=02 لكتابة قيمة AL على الشاشة بصيغة Hex، DH=04H لكتابة قيمة AX على الشاشة بصيغة Hex.
- INT 21H: AH=00H قراءة حرف من الإدخال بدون Echo وتخزينه في AL. AH=01H قراءة حرف مع Echo وتخزينه في AL. AH=02H كتابة الحرف الموجود في DL على الشاشة بصيغة ASCII. AH=09H طباعة سلسلة نصية (String) موجودة في DS:DX على الشاشة، ويجب أن تنتهي السلسلة بالرمز '$'. AH=4CH إيقاف البرنامج.

=== Introduction to IoT Course ===

Section 1 - Introduction to IoT:
- Definition: A network of connected things that can communicate data without human involvement (smart appliances, electronics, machines). IoT is a system of interrelated computing, mechanical, and digital devices/machines provided with unique identifiers (UIDs), able to transfer data over a network without requiring human-to-human or human-to-computer interaction.
- History: 1982 first connected device (a Coca-Cola vending machine), 1991 Mark Weiser's paper on ubiquitous computing, 1993-1997 several companies proposed solutions (Microsoft's At Work, Novell's NEST), 1999 the field gains real momentum.
- Network types: LAN (Local Area Network — communication between devices), MAN (communication between servers, larger geographic area), WAN (Wide Area Network — covers cities), PAN (Personal Area Network — devices belonging to the same person).
- Most common IoT technology today: Patient monitors (64%), Energy meters (56%), X-rays and imaging (33%).

Section 2 - Enabling Technologies:
- Addressability: The original idea of the Auto-ID center is based on RFID tags and distinct identification through the Electronic Product Code (EPC); every device is assigned its own ID.
- Application Layer: Protocols and a supporting framework are required to implement IoT applications (example: ADRC).
- Short-range wireless: Bluetooth, LiFi (uses an LED transmitter, lower cost but requires line of sight and offers higher data rate than WiFi in that context), NFC, RFID (contactless scan), WiFi (802.11), ZigBee (low power consumption, low data rate, low cost, high throughput), Z-Wave (automation and security).
- Medium-range wireless: high speed, higher throughput, lower latency, good coverage — example: 5G (supports a large number of users per device).
- Long-range wireless: LPWAN (low power), VSAT (Very Small Aperture Terminal — satellite technology using small dish antennas for narrowband and broadband); SNR = Ps/Pn.
- Wired technologies: Ethernet (twisted pair and fiber optic links with hubs/switches), Power Line Communication PLC (uses electrical wiring to carry power and data — e.g., HomePlug, G.hn).

Section 3 - IoT Vertical Applications:
- Consumer Applications: 1) Smart Home — home automation (heating, lighting, air conditioning); benefit: energy saving by turning lights off automatically. 2) Elder Care — keep caring for disabilities and elderly individuals.
- Organizational Applications: 1) Medical and healthcare — data collection and analysis for research and monitoring. 2) Transportation. 3) V2X Communication (Vehicle to Everything): V2V (vehicle to vehicle), V2I (vehicle to infrastructure), V2P (vehicle to pedestrian) — V2X is the first step toward autonomous driving and connected road infrastructure.
- Building and Home Automation: monitor and control mechanical, electrical, and electronic systems — public/private buildings, industrial, or residential.
- Industrial Applications: 1) Manufacturing. 2) Agriculture — collecting data on temperature, rainfall, humidity, wind speed, pest infestation, and soil content to automate farming techniques, make informed decisions to improve quality/quantity, minimize risk and waste, and reduce effort (e.g., a farmer can monitor soil temperature/moisture remotely and apply IoT-acquired data to precision fertilization).
- Infrastructure Applications: 1) Energy Management — reduce power consumption and improve production efficiency. 2) Environmental monitoring — water quality, atmospheric/soil conditions, wildlife movement/habitats. 3) Living Lab — combines research and innovation processes.
- Military Applications: Internet of Battlefield Things — project initiated by the U.S. Army Research Laboratory (ARL) to enhance soldiers' capabilities. Ocean of Things — a program to establish an IoT across large oceans to collect, monitor, and analyze environmental and vessel activity data.

Research Directions & Architecture:
- Problems from large numbers of IoT users: 1) Network traffic causing delay. 2) Conflict (same frequency/location/time causing retransmission). Solved via Multiple Access Control: CDMA (Code), SDMA (Space), FDMA (Frequency), TDMA (Time).
- Intelligence: can be offered at 3 levels — 1) IoT devices, 2) Edge/Fog nodes, 3) Cloud computing. The need for intelligent control/decision at each level depends on the time-sensitivity of the application (e.g., an autonomous vehicle's camera needs real-time obstacle detection to avoid an accident).
- Architecture: IoT system architecture mainly consists of three tiers: Tier 1: Devices — sensors (reading) and actuators (acting). Tier 2: the Edge Gateway — aggregates sensor data, pre-processes it, and secures connectivity to the cloud (using systems like WebSockets, Event Hub) and in some cases provides edge analytics or fog computing. Tier 3: the Cloud — storage and advanced processing (accessed via cellular, WiFi, mobile, DSL, fibre; the gateway typically uses Thread, Bluetooth, ZigBee, NFC, etc.; "things" include sensors, actuators, IoT-enabled devices, and mesh networks).
- Scalability: the ability of a network to add/remove users without affecting its main function. IETF's Constrained Application Protocol (CoAP), along with ZeroMQ and MQTT, play a relevant role in providing lightweight data transport; Fog Computing is a viable alternative to prevent large bursts of data flow through the internet to the cloud.
- Size & Space Considerations: smart devices, being online (connected at the same time), sensor location, GPS, relative position (with respect to a reference/controller), and Geo Web / Digital Earth — applications that become possible when things can be organized and connected by location.

Section 4 - IoT Challenges:
1) Security: the biggest challenge — any new technology in IoT attracts attacks.
2) Regulation: government regulation often takes a long time to catch up with the current state of technology; the lack of strong IoT regulation is a big part of why IoT remains a severe security risk, and the problem is likely to get worse as the attack surface expands to include ever more crucial devices.
3) Compatibility: Bluetooth has long been the compatibility standard for IoT devices; for home automation, ZigBee and Z-Wave are common; continued compatibility for IoT devices also depends on the users themselves.
4) Bandwidth: a massive number of connections may cause limitations, especially for bandwidth-intensive applications like video streaming; partial solution is intelligent switching between available mobile network operators.
5) Energy Consumption: efforts try to increase battery age via Idle/Sleep mode (low frequency, low power) versus Normal/Full mode (high frequency, high power).
6) Customer Expectations: businesses entering this competitive, innovative sector must be prepared for a market that never sits still and customers who always want a smoother, more advanced experience.

Experiment 4 - Logical Instructions AND / OR / XOR:
- AND — application: clear a bit. Any bit ANDed with 0 becomes 0; any bit ANDed with 1 stays unchanged.
- OR — application: set a bit. Any bit ORed with 1 becomes 1; any bit ORed with 0 stays unchanged.
- XOR — performs a Boolean exclusive-OR: if the two bits match, the result is 0; if they differ, the result is 1.
- Worked examples: convert a capital letter to lowercase using OR (adds 32 by setting bit b5): MOV AL,'A' then OR AL,00100000b. Convert lowercase to capital using AND (clears bit b5): MOV AL,'a' then AND AL,11011111b. Both conversions can also be done with XOR AL,00100000b.

Experiment 5 - Shift and Rotate:
- Logical shifts: SHL (shift left) and SHR (shift right). Arithmetic shifts: SAL (shift left, same as SHL) and SAR (shift right, preserves the sign bit by repeating it).
- Application of SHL/SAL: multiplies the value by 2^n (n = number of shifted bits). Application of SHR: divides the value by 2^n. Application of SAR: divides while preserving the sign, by repeating the sign bit on right shifts.
- Rotate: without carry: ROL (rotate right/left as shown) and ROR — do not change the Carry Flag. With carry: RCL and RCR — bring the Carry Flag into/out of the rotation and do change it.
- Worked example (Part 1): MOV DL,5 then MOV CL,2 then SHL DL,CL gives DL = 5×2² = 14H (20 decimal).

- CMP compares two values, used together with conditional jump instructions like JG (Jump if Greater) to branch based on the comparison result.
- Loop: a repeat instruction driven by CX (CX is automatically decremented each iteration and looping continues until it reaches zero) — e.g., used to sum array elements (DB) via a SI pointer combined with ADD, INC SI, and LOOP.

Experiment 7 - ADD, SUB, MUL, DIV:
- ADD: Z = X + Y (example: ADD AX,BX, result in AX).
- SUB: Z = X - Y (example: SUB AX,BX, result in AX).
- MUL: Z = X × Y — the two operands (X, Y) must be the same size, and the product (Z) is twice their size, split across two registers (example: MUL BX gives AX×BX with the upper half in DX and the lower half in AX). MUL sets the Carry and Overflow flags if the upper half of the product is not equal to zero.
- DIV: Z = X ÷ Y — the divisor and dividend must follow the same size rule; the quotient result is in AX, and the remainder is in DX.

- Definition: a set of procedures accessible to the programmer. BIOS uses type INT 10H (functions 10-1A hex); MS-DOS uses INT 21H (functions 20-3F hex).

- Objectives: Learn to configure a simple electric circuit and apply Ohm's Law practically.
- Equipment: Power supply, wires, digital multimeter, variable resistor (Resistor Box).
- Equations: V = I × R, I = V/R, R = V/I.
- Key idea: Current and resistance are inversely related; voltage and current are directly related.

Experiment 3: Series and Parallel Connection of Circuit Elements
- Objectives: Learn to connect circuit elements in series and parallel, and calculate equivalent resistance, current, and voltage, comparing with theoretical values.
- Equipment: Wires, variable resistors (Resistor Box), power supply, multimeter.
- Equations: Series: Req = R1+R2+...+Rn (voltage divides, current constant). Parallel: 1/Req = 1/R1+1/R2+...+1/Rn (voltage constant, current divides).
- Also covers using a Breadboard for connections.

Experiment 4: Kirchhoff's Laws & Superposition Theorem
- Objectives: Learn about the breadboard, prove KVL and KCL practically, and understand and apply the superposition principle.
- Equipment: Power supply, multimeters, wires, fixed resistors, breadboard.
- Key idea KVL: sum of voltages around a closed loop = 0. Key idea KCL: sum of currents into a node = sum of currents out.
- Superposition: analyze each source's effect separately (short-circuit voltage sources, open-circuit current sources when not being analyzed), then sum results.

Experiment 5: Thevenin's Theorem and Maximum Power Transfer
- Objectives: Learn and verify Thevenin's theorem and maximum power transfer, and understand the relationship between power transfer and the load.
- Equipment: Variable resistor, resistance box, multimeter, wires, power supply.
- Key idea: Any complex circuit of sources and resistors can be replaced by a single voltage source (Vth) and single series resistance (Rth).
- Maximum power transfer occurs when load resistance RL equals Thevenin resistance Rth.

  // ----- Image attach -----
  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      alert('الرجاء اختيار ملف صورة / Please select an image file');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      selectedImageDataUrl = reader.result;
      imgPreviewThumb.src = selectedImageDataUrl;
      imgPreviewRow.classList.add('show');
    };
    reader.readAsDataURL(file);
  });

  imgPreviewRemove.addEventListener('click', () => {
    selectedImageDataUrl = null;
    fileInput.value = '';
    imgPreviewRow.classList.remove('show');
  });

  // ----- Voice input -----
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  function updateVoiceLangBtn(){
    voiceLangBtn.textContent = voiceLang.startsWith('ar') ? 'AR' : 'EN';
  }
  updateVoiceLangBtn();

  voiceLangBtn.addEventListener('click', () => {
    voiceLang = voiceLang.startsWith('ar') ? 'en-US' : 'ar-JO';
    updateVoiceLangBtn();
    if(recognition) recognition.lang = voiceLang;
  });

  if(SpeechRecognitionAPI){
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = voiceLang;

    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add('active', 'recording');
    };

    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove('active', 'recording');
    };

    recognition.onerror = () => {
      recognizing = false;
      micBtn.classList.remove('active', 'recording');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      chatInput.value = chatInput.value ? (chatInput.value + ' ' + transcript) : transcript;
      chatInput.focus();
    };

    micBtn.addEventListener('click', () => {
      if(recognizing){
        recognition.stop();
        return;
      }
      recognition.lang = voiceLang;
      try{ recognition.start(); }catch(e){ /* already started */ }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = 'الإدخال الصوتي غير مدعوم في هذا المتصفح / Voice input not supported in this browser';
  }

  async function sendMessage(){
    const text = chatInput.value.trim();
    const imageDataUrl = selectedImageDataUrl;
    if(!text && !imageDataUrl) return;

    const userLang = detectLanguage(text || '');

    addMessage('user', text, imageDataUrl);

    // Build the content sent to the API for this turn (multipart if an image is attached)
    let apiUserContent;
    if(imageDataUrl){
      apiUserContent = [
        { type: "text", text: text || (userLang === 'ar' ? "صف هذه الصورة" : "Describe this image") },
        { type: "image_url", image_url: { url: imageDataUrl } }
      ];
    } else {
      apiUserContent = text;
    }

    // Keep history lightweight: store the plain text for future context (images aren't replayed)
    history.push({ role: 'user', content: text || (userLang === 'ar' ? "[صورة مرفقة]" : "[attached image]") });

    chatInput.value = '';
    selectedImageDataUrl = null;
    fileInput.value = '';
    imgPreviewRow.classList.remove('show');
    sendBtn.disabled = true;
    addTyping();

    try{
      const priorHistory = history.slice(0, -1).map(msg => ({ role: msg.role, content: msg.content }));
      const messages = [
        { role: "system", content: getSystemPrompt(userLang) },
        ...priorHistory,
        { role: 'user', content: apiUserContent }
      ];

      const model = imageDataUrl ? "qwen/qwen3.6-27b" : "llama-3.3-70b-versatile";

      const response = await fetch(
        "https://api.groq.com/openai/v1/chat/completions",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            max_tokens: 1000,
            temperature: 0.7
          })
        }
      );

      if(!response.ok){
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error?.message || `Error ${response.status}`);
      }

      const data = await response.json();
      const replyText = data.choices?.[0]?.message?.content || "";

      removeTyping();
      addMessage('ai', replyText || (userLang === 'ar' ? "عذراً، لم أحصل على رد." : "Sorry, I didn't get a response."));
      history.push({ role: 'assistant', content: replyText });

    }catch(err){
      removeTyping();
      addMessage('ai', `خطأ: ${err.message}`);
      console.error("Error:", err);
    }finally{
      sendBtn.disabled = false;
      chatInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
</script>
